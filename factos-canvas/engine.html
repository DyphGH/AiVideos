<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:M;font-weight:900;src:url(/mont900.woff2)}html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="cv" width="1080" height="1920"></canvas>
<script type="module">
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const K={c,NV:'#0d1636',Y:'#ffd21f',
 clamp:(x,a,b)=>Math.max(a,Math.min(b,x)),ease:x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3),
 back:x=>{x=Math.max(0,Math.min(1,x));const s=1.7;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);},
 lin(x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,col])=>g.addColorStop(o,col));return g;},
 rad(x,y,r0,r1,st,x1,y1){const g=c.createRadialGradient(x,y,r0,x1??x,y1??y,r1);st.forEach(([o,col])=>g.addColorStop(o,col));return g;},
 fs(fill,lw=0,st='#0d1636'){c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=st;c.lineJoin='round';c.stroke();}},
 text(s,x,y,size,fill='#fff',lw=18,st='#0d1636',align='center'){c.font=`900 ${size}px M`;c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';if(lw){c.lineWidth=lw;c.strokeStyle=st;c.strokeText(s,x,y);}c.fillStyle=fill;c.fillText(s,x,y);},
 rich(parts,x,y,size,lw=18){c.font=`900 ${size}px M`;const w=parts.reduce((a,[s])=>a+c.measureText(s).width,0);let cx=x-w/2;c.textAlign='left';c.textBaseline='middle';c.lineJoin='round';
   for(const [s,f] of parts){c.lineWidth=lw;c.strokeStyle='#0d1636';c.strokeText(s,cx,y);c.fillStyle=f;c.fillText(s,cx,y);cx+=c.measureText(s).width;}},
 sunburst(cx,cy,col1,col2,rot=0,n=24){c.fillStyle=col1;c.fillRect(0,0,1080,1920);c.save();c.translate(cx,cy);c.rotate(rot);c.fillStyle=col2;for(let i=0;i<n;i++){c.beginPath();c.moveTo(0,0);c.arc(0,0,2400,i*2*Math.PI/n,(i+0.5)*2*Math.PI/n);c.closePath();c.fill();}c.restore();
   c.fillStyle=K.rad(cx,cy,50,1300,[[0,'rgba(255,255,255,.12)'],[1,'rgba(0,0,0,.45)']]);c.fillRect(0,0,1080,1920);}
};
const S=(await import('/scene.js')).default(K);const CAP=await (await fetch('/captions.json')).json();
function caption(t){const l=CAP.lines.find(l=>t>=l.start&&t<l.end);if(!l)return;const per=(l.end-l.start)/l.chunks.length;const i=Math.min(l.chunks.length-1,Math.floor((t-l.start)/per));const loc=t-l.start-i*per;const sc=loc<.1?1.15-loc/.1*.15:1;
  const parts=l.chunks[i].split('*').map((s,k)=>[s,k%2?'#ffd21f':'#ffffff']);c.save();c.translate(540,CAP.y);c.scale(sc,sc);K.rich(parts,0,0,92,20);c.restore();}
window.renderAt=(f)=>{const t=f/30;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,1080,1920);S.frame(t);if(!window.nocap)caption(t);};
await document.fonts.load('900 40px M');window.ready=true;
</script></body></html>
