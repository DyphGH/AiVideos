<script>
// fb3: fb2 + snowmen circles (snow), snowflake icon (flake), Müller-Lyer (ml), gifts count (gifts). fb2: hit0ms puzzles 06+ (grid with row/col labels, triangles, squares). Same look as fb.html.
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const P=JSON.parse(decodeURIComponent(location.hash.slice(1)));
function lin(x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,k])=>g.addColorStop(o,k));return g;}
function fs(f,lw,s='#14202e'){c.fillStyle=f;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=s;c.stroke();}}
function fit(txt,font,size,maxw){c.font=`${font.replace('$',size)}`;while(c.measureText(txt).width>maxw&&size>20){size-=2;c.font=font.replace('$',size);}}
function star(x,y,R,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();}
const I={
 tree(odd){c.lineJoin='round';
   c.beginPath();c.roundRect(-6,24,12,13,2);fs('#8a5a2b',2,'#4a2c10');
   const T=[[-27,-7,17],[-14,10,24],[0,28,31]];
   for(let i=T.length-1;i>=0;i--){const [a,b,w]=T[i];c.beginPath();c.moveTo(0,a);c.quadraticCurveTo(w*.5,(a+b)/2,w,b);c.quadraticCurveTo(0,b+5,-w,b);c.quadraticCurveTo(-w*.5,(a+b)/2,0,a);c.closePath();fs(lin(0,a,0,b,[[0,'#3fbf5f'],[1,'#1f8a3d']]),2.5,'#0f4a22');}
   c.beginPath();c.moveTo(-17,3);c.quadraticCurveTo(0,10,19,1);c.lineWidth=2.5;c.strokeStyle='#f3f3f3';c.stroke();
   c.beginPath();c.moveTo(-24,20);c.quadraticCurveTo(0,28,26,17);c.stroke();
   for(const [x,y,k] of [[-7,-8,'#e5383b'],[8,-3,'#4dabf7'],[-12,13,'#ffd43b'],[4,15,'#e5383b'],[16,23,'#ffd43b'],[-18,25,'#4dabf7'],[1,-16,'#ffd43b']]){c.beginPath();c.arc(x,y,3.6,0,7);fs(k,1.5,'rgba(0,0,0,.45)');}
   if(!odd){star(0,-32,11,4.6);fs('#ffcf1f',2,'#9a6a00');}},
 santa(odd){c.lineJoin='round';c.lineCap='round';const K='#5a1a14';
   // shoulders (red coat + white collar)
   c.beginPath();c.ellipse(0,40,31,13,0,Math.PI,0);c.closePath();fs('#d62828',2.5,K);
   // hat
   c.beginPath();c.moveTo(-24,-14);c.quadraticCurveTo(-14,-44,8,-43);c.quadraticCurveTo(24,-41,27,-27);c.lineTo(24,-14);c.closePath();fs('#d62828',2.5,K);
   c.beginPath();c.arc(26,-28,5.5,0,7);fs('#fff',2,'#9aa3ad');
   if(odd){for(const [x,y] of [[-19,0],[19,0],[-20,11],[20,11],[-15,19],[15,19]]){c.beginPath();c.arc(x,y,6.5,0,7);fs('#fff',2,'#9aa3ad');}}
   // face
   c.beginPath();c.arc(0,1,18,0,7);fs('#f6c9a8',2.5,'#8a5a3b');
   for(const s of [-1,1]){c.beginPath();c.arc(s*10,6,4,0,7);c.fillStyle='rgba(235,90,90,.45)';c.fill();}
   if(!odd){ // beard + moustache
     c.beginPath();c.moveTo(-19,1);c.bezierCurveTo(-22,22,-10,34,0,35);c.bezierCurveTo(10,34,22,22,19,1);c.quadraticCurveTo(0,13,-19,1);c.closePath();fs('#fff',2,'#9aa3ad');
     for(const s of [-1,1]){c.beginPath();c.ellipse(s*6,7,7,4,s*.25,0,7);fs('#fff',1.6,'#9aa3ad');}
   }else{ // smile + white collar + glasses
     c.beginPath();c.arc(0,8,6,.25*Math.PI,.75*Math.PI);c.lineWidth=2.2;c.strokeStyle=K;c.stroke();
     c.beginPath();c.ellipse(0,29,15,4.5,0,0,7);fs('#fff',2,'#9aa3ad');
   }
   c.beginPath();c.arc(0,4,3.6,0,7);fs('#ee8b7a',1.4,'#8a5a3b');
   for(const s of [-1,1]){c.beginPath();c.arc(s*7,-3,2.3,0,7);c.fillStyle='#1b1b1b';c.fill();}
   if(odd){c.lineWidth=2;c.strokeStyle='#1b1b1b';for(const s of [-1,1]){c.beginPath();c.arc(s*7,-3,5.2,0,7);c.stroke();}c.beginPath();c.moveTo(-2,-3);c.lineTo(2,-3);c.stroke();}
   // hat trim
   c.beginPath();c.roundRect(-27,-19,54,10,5);fs('#fff',2,'#9aa3ad');},
 flake(odd){const n=odd?5:6;c.save();c.rotate(-Math.PI/2);c.lineCap='round';c.strokeStyle='#2b7bd9';c.lineWidth=5;
   for(let i=0;i<n;i++){c.save();c.rotate(i*2*Math.PI/n);c.beginPath();c.moveTo(0,0);c.lineTo(30,0);c.moveTo(16,0);c.lineTo(24,-8);c.moveTo(16,0);c.lineTo(24,8);c.moveTo(24,0);c.lineTo(30,-6);c.moveTo(24,0);c.lineTo(30,6);c.stroke();c.restore();}
   c.beginPath();c.arc(0,0,6,0,7);fs('#bfe3ff',2.5,'#2b7bd9');c.restore();},
 letter(odd){c.font=P.font;c.textAlign='center';c.textBaseline='middle';c.fillStyle=P.ink;c.fillText(odd?P.odd:P.char,0,3);}
};
function bg(){c.fillStyle=lin(0,0,0,1350,[[0,P.bg1],[1,P.bg2]]);c.fillRect(0,0,1080,1350);c.save();c.globalAlpha=.06;c.fillStyle='#fff';for(let y=0;y<1350;y+=28)for(let x=(y/28%2)*14;x<1080;x+=28){c.beginPath();c.arc(x,y,2,0,7);c.fill();}c.restore();}
function pill(x,y,txt,font,col='#ff3b3b'){c.save();c.font=font;const w=c.measureText(txt).width+44;x=Math.max(70+w/2,Math.min(1010-w/2,x));c.beginPath();c.roundRect(x-w/2,y-30,w,60,30);c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=14;fs(col,4,'#fff');c.shadowBlur=0;c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(txt,x,y+2);c.restore();}
const px=60,py=200,pw=960,ph=930;
function line(x0,y0,x1,y1,w,col){c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.lineWidth=w;c.strokeStyle=col;c.lineCap='round';c.stroke();}
function answerBox(lines){ // bottom area of panel (y 880..1110)
  c.save();c.beginPath();c.roundRect(110,875,860,230,28);fs(P.answer?'#ff3b3b':'rgba(0,0,0,.05)',P.answer?5:3,P.answer?'#fff':'rgba(0,0,0,.12)');
  c.textAlign='center';c.textBaseline='middle';
  if(!P.answer){c.font='60px Anton';c.fillStyle=P.ink;c.fillText('?',540,935);c.font='800 34px Inter';c.fillText('COMMENT YOUR ANSWER BELOW',540,1010);c.font='800 24px Inter';c.globalAlpha=.6;c.fillText('THINK TWICE BEFORE YOU ANSWER',540,1058);}
  else{c.font='86px Anton';c.fillStyle='#fff';c.fillText('ANSWER: '+P.ans,540,935);c.font='800 30px Inter';lines.forEach((t,i)=>c.fillText(t,540,1012+i*44));}
  c.restore();}
// ---- legs puzzle (10): every leg is drawn through LEG(), which counts it and remembers where its foot is.
// P.dbg renders ONLY the legs (black on white) so verify3.py can count them as separate blobs.
const FEET=[],LEGS={};let ITEM='';
function body(fn){if(!P.dbg)fn();}
function LEG(fx,fy,fn,ox=0,oy=24){const col=P.dbg?'#000':null;fn(col);LEGS[ITEM]=(LEGS[ITEM]||0)+1;const q=c.getTransform().transformPoint(new DOMPoint(fx,fy));FEET.push([q.x+ox,q.y+oy]);}
function ell(x,y,rx,ry,rot,f,lw,s){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,7);fs(f,lw,s);}
function chicken(){const K='#5a2e12',O='#f0a020';
  body(()=>{for(const [x,y,r] of [[-70,-118,.9],[-74,-100,.5],[-66,-136,1.3]]){ell(x,y,30,13,r,'#8c3a12',2.5,K);}});
  for(const fx of [-24,20])LEG(fx,4,col=>{c.lineCap='round';c.lineJoin='round';c.lineWidth=7;c.strokeStyle=col||O;
    c.beginPath();c.moveTo(fx*.8,-55);c.lineTo(fx,0);c.stroke();c.lineWidth=5;
    for(const [dx,dy] of [[-13,3],[0,6],[14,2]]){c.beginPath();c.moveTo(fx,0);c.lineTo(fx+dx,dy);c.stroke();}});
  body(()=>{ell(-5,-95,62,48,0,lin(0,-140,0,-50,[[0,'#f08a3c'],[1,'#d0661f']]),3,K);
    ell(-18,-96,34,22,-.15,'#c0561a',2.5,K);c.beginPath();c.moveTo(-36,-92);c.quadraticCurveTo(-18,-82,0,-95);c.lineWidth=2.5;c.strokeStyle=K;c.stroke();
    for(const [x,y] of [[38,-176],[49,-181],[60,-174]]){c.beginPath();c.arc(x,y,9,0,7);fs('#e5383b',2.5,'#7a1010');}
    c.beginPath();c.arc(45,-148,27,0,7);fs('#f08a3c',3,K);
    ell(67,-128,6,10,0,'#e5383b',2,'#7a1010');
    c.beginPath();c.moveTo(68,-156);c.lineTo(90,-148);c.lineTo(68,-140);c.closePath();fs('#ffc31f',2.5,'#8a5a00');
    c.beginPath();c.arc(54,-153,4.5,0,7);c.fillStyle='#111';c.fill();c.beginPath();c.arc(55.5,-154.5,1.6,0,7);c.fillStyle='#fff';c.fill();});}
function dog(){const K='#3e220c',B='#c98a4b',D='#a86d34';
  body(()=>{c.beginPath();c.moveTo(-95,-140);c.quadraticCurveTo(-140,-150,-138,-196);c.lineWidth=14;c.lineCap='round';c.strokeStyle=K;c.stroke();c.lineWidth=9;c.strokeStyle=B;c.stroke();});
  for(const [fx,far] of [[-80,1],[-42,0],[44,1],[82,0]])LEG(fx,4,col=>{c.beginPath();c.roundRect(fx-10,-112,20,104,8);if(col){c.fillStyle=col;c.fill();}else fs(far?D:B,3,K);
    c.beginPath();c.ellipse(fx+3,-5,13,7,0,0,7);if(col){c.fillStyle=col;c.fill();}else fs(far?D:B,3,K);});
  body(()=>{ell(0,-125,108,46,0,B,3,K);ell(-10,-108,70,22,0,'#e0ad74');
    ell(122,-176,38,36,0,B,3,K);ell(152,-160,28,19,0,'#e0ad74',3,K);ell(176,-166,8,6.5,0,'#1b1b1b');
    c.beginPath();c.moveTo(150,-148);c.quadraticCurveTo(160,-141,170,-150);c.lineWidth=2.5;c.strokeStyle=K;c.stroke();
    ell(98,-170,13,28,.35,'#7a4a1f',3,K);
    c.beginPath();c.arc(130,-186,5,0,7);c.fillStyle='#111';c.fill();c.beginPath();c.arc(131.5,-187.5,1.8,0,7);c.fillStyle='#fff';c.fill();
    c.beginPath();c.moveTo(92,-150);c.quadraticCurveTo(105,-134,116,-142);c.lineWidth=9;c.lineCap='round';c.strokeStyle='#e5383b';c.stroke();
    c.beginPath();c.arc(108,-136,5,0,7);fs('#ffc31f',2,'#8a5a00');});}
function spider(){const K='#141414';
  const LG=[[[18,-44],[70,-100],[112,-70]],[[28,-30],[95,-60],[138,-20]],[[29,-12],[98,-20],[135,40]],[[22,2],[80,25],[105,95]]];
  for(const s of [-1,1])for(const [[x0,y0],[kx,ky],[fx,fy]] of LG)
    LEG(s*fx,fy,col=>{c.lineCap='round';c.lineJoin='round';c.lineWidth=8;c.strokeStyle=col||K;c.beginPath();c.moveTo(s*x0,y0);c.lineTo(s*kx,ky);c.lineTo(s*fx,fy);c.stroke();},s*(fx-kx)/Math.hypot(fx-kx,fy-ky)*22,(fy-ky)/Math.hypot(fx-kx,fy-ky)*22);
  body(()=>{c.beginPath();c.arc(0,42,46,0,7);fs(lin(0,0,0,90,[[0,'#3d3d47'],[1,'#1c1c22']]),3,K);
    c.beginPath();c.moveTo(-9,22);c.lineTo(9,22);c.lineTo(-9,52);c.lineTo(9,52);c.closePath();c.fillStyle='#e5383b';c.fill();
    c.beginPath();c.arc(0,-20,31,0,7);fs('#2e2e36',3,K);
    for(const s of [-1,1]){c.beginPath();c.arc(s*11,-26,9,0,7);fs('#fff',2,K);c.beginPath();c.arc(s*11+2,-25,4.2,0,7);c.fillStyle='#111';c.fill();}
    c.beginPath();c.arc(0,-12,7,.15*Math.PI,.85*Math.PI);c.lineWidth=2.5;c.strokeStyle='#fff';c.stroke();});}
function stool(){const K='#4a2c10',W='#c98a4b';
  for(const [x0,x1,y1,w] of [[0,0,-30,15],[-52,-74,0,17],[52,74,0,17]])LEG(x1,y1+4,col=>{c.beginPath();c.moveTo(x0-w/2,-140);c.lineTo(x0+w/2,-140);c.lineTo(x1+w/2,y1);c.lineTo(x1-w/2,y1);c.closePath();
    if(col){c.fillStyle=col;c.fill();}else fs(x0===0?'#a86d34':W,3,K);});
  body(()=>{c.beginPath();c.moveTo(-80,-160);c.lineTo(-80,-140);c.ellipse(0,-140,80,20,0,Math.PI,0,true);c.lineTo(80,-160);c.closePath();fs('#a86d34',3,K);
    ell(0,-160,80,20,0,lin(0,-180,0,-140,[[0,'#e0ad74'],[1,'#c98a4b']]),3,K);ell(-6,-163,48,9,0,'rgba(255,255,255,.18)');});}
function drawLegs(){
  const items=[['chicken',chicken,165,525,.86],['chicken',chicken,350,525,.86],['chicken',chicken,535,525,.86],['spider',spider,830,400,1],
               ['dog',dog,215,822,.88],['dog',dog,540,822,.88],['stool',stool,855,822,1]];
  for(const [n,fn,x,y,s] of items){ITEM=n;c.save();c.translate(x,y);c.scale(s,s);fn();c.restore();}
  window.check={legs:LEGS,total:Object.values(LEGS).reduce((a,b)=>a+b,0),feet:FEET.length};
  if(P.dbg)return;
  if(P.answer){c.save();c.textAlign='center';c.textBaseline='middle';
    FEET.forEach(([x,y],i)=>{c.beginPath();c.arc(x,y,15,0,7);fs('#ff3b3b',3,'#fff');c.font='800 17px Inter';c.fillStyle='#fff';c.fillText(i+1,x,y+1);});c.restore();}
  answerBox(['CHICKENS 3×2 + DOGS 2×4 + SPIDER 8 + STOOL 3','6 + 8 + 8 + 3 = 25']);
}
(async()=>{await document.fonts.load('70px Anton');await document.fonts.load('800 38px Inter');await document.fonts.load('900 38px Inter');
if(P.dbg){c.fillStyle='#fff';c.fillRect(0,0,1080,1350);drawLegs();window.done=true;return;}
bg();c.textAlign='center';c.textBaseline='middle';
fit(P.t1,'$px Anton',72,990);c.fillStyle='#fff';c.fillText(P.t1,540,92);
fit(P.t2,'800 $px Inter',38,980);c.fillStyle=P.acc;c.fillText(P.t2,540,156);
c.beginPath();c.roundRect(px,py,pw,ph,36);fs(P.panel,5,'rgba(255,255,255,.25)');
if(P.mode==='grid'){
  const L=46,cols=P.cols,rows=P.rows,cw=Math.floor((pw-L-18)/cols),ch=Math.floor((ph-L-18)/rows),gx=px+L+Math.floor((pw-L-18-cw*cols)/2),gy=py+L+Math.floor((ph-L-18-ch*rows)/2);
  c.font='800 22px Inter';c.fillStyle=P.lab;c.textAlign='center';c.textBaseline='middle';
  for(let q=0;q<cols;q++)c.fillText(q+1,gx+cw*(q+.5),py+L/2+4);
  for(let r=0;r<rows;r++)c.fillText(r+1,px+L/2+4,gy+ch*(r+.5));
  for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){const odd=(r===P.or&&q===P.oc);c.save();c.translate(gx+Math.floor(cw/2)+cw*q,gy+Math.floor(ch/2)+ch*r);c.scale(P.sc,P.sc);I[P.icon](odd);c.restore();}
  // verification: for every cell, count pixels that differ strongly (>48 in any channel) from each other cell;
  // a cell is "odd" if its median difference vs all other cells is large (ignores gradient dithering noise)
  const D=[];for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)D.push({rc:[r+1,q+1],d:c.getImageData(gx+cw*q,gy+ch*r,cw,ch).data});
  const score=D.map(a=>{const v=D.filter(b=>b!==a).map(b=>{let n=0;for(let i=0;i<a.d.length;i+=4)if(Math.abs(a.d[i]-b.d[i])>48||Math.abs(a.d[i+1]-b.d[i+1])>48||Math.abs(a.d[i+2]-b.d[i+2])>48)n++;return n;}).sort((x,y)=>x-y);return v[v.length>>1];});
  window.check={cells:D.length,odd:D.map((a,i)=>({rc:a.rc,s:score[i]})).filter(o=>o.s>20),maxNormal:Math.max(...score.filter(s=>s<=20))};
  if(P.answer){const x=gx+cw*(P.oc+.5),y=gy+ch*(P.or+.5);c.save();c.beginPath();c.arc(x,y,Math.max(cw,ch)*.62,0,7);c.lineWidth=10;c.strokeStyle='#ff3b3b';c.shadowColor='#ff3b3b';c.shadowBlur=20;c.stroke();c.restore();
    pill(x,y+(P.or<rows-2?ch*1.25+8:-ch*1.25-8),`ROW ${P.or+1}, COLUMN ${P.oc+1}`,'800 30px Inter');}
}
if(P.mode==='tri'){
  const [ax,ay]=P.apex,[[bx0,by],[bx1]]=P.base,hy=P.hy,t=(hy-ay)/(by-ay);
  if(P.answer){ // shade the two parts in soft colours
    c.beginPath();c.moveTo(ax,ay);c.lineTo(ax+(bx0-ax)*t,hy);c.lineTo(ax+(bx1-ax)*t,hy);c.closePath();c.fillStyle='rgba(77,212,255,.28)';c.fill();
    c.beginPath();c.moveTo(ax+(bx0-ax)*t,hy);c.lineTo(bx0,by);c.lineTo(bx1,by);c.lineTo(ax+(bx1-ax)*t,hy);c.closePath();c.fillStyle='rgba(255,176,32,.25)';c.fill();}
  c.lineJoin='round';const W=12;
  for(const bx of [bx0,...P.inner,bx1])line(ax,ay,bx,by,W,P.ink);
  line(bx0,by,bx1,by,W,P.ink);line(ax+(bx0-ax)*t,hy,ax+(bx1-ax)*t,hy,W,P.answer?'#0a8fc0':P.ink);
  answerBox(P.bd);
}
if(P.mode==='sq'){
  const {x0,y0,size,n4}=P,s=size/n4;
  if(P.answer){const ex=[[0,0,1,'#e5383b',14],[2,0,2,'#1c7ed6',14],[0,1,3,'#2f9e44',26]];
    c.save();c.lineWidth=9;c.lineJoin='round';for(const [i,j,k,col,m] of ex){c.strokeStyle=col;c.strokeRect(x0+i*s+m,y0+j*s+m,k*s-2*m,k*s-2*m);}c.restore();}
  c.lineCap='square';for(let i=0;i<=n4;i++){line(x0+i*s,y0,x0+i*s,y0+size,12,P.ink);line(x0,y0+i*s,x0+size,y0+i*s,12,P.ink);}
  if(P.answer){c.save();c.lineWidth=10;c.strokeStyle='#e8a400';c.strokeRect(x0-14,y0-14,size+28,size+28);c.restore();}
  answerBox(['1×1: 16  +  2×2: 9  +  3×3: 4  +  4×4: 1','16 + 9 + 4 + 1 = 30']);
}
if(P.mode==='legs')drawLegs();
if(P.mode==='rect'){
  const ex=[[1,1,6,'#e5383b'],[2,1,4,'#1c7ed6'],[3,1,2,'#2f9e44'],[1,2,3,'#9c36b5'],[2,2,2,'#e8590c'],[3,2,1,'#0b7285']];
  // brute-force count of the drawn figure (all pairs of vertical x horizontal lines), exported for verification
  const V=P.cols+1,H=P.rows+1,cnt={};for(let a=0;a<V;a++)for(let b=a+1;b<V;b++)for(let d=0;d<H;d++)for(let e=d+1;e<H;e++){const k=(b-a)+'x'+(e-d);cnt[k]=(cnt[k]||0)+1;}
  window.check={total:Object.values(cnt).reduce((x,y)=>x+y,0),bySize:cnt};
  if(!P.answer){const s=P.s,x0=540-s*P.cols/2,y0=P.y0;c.lineCap='square';
    for(let i=0;i<=P.cols;i++)line(x0+i*s,y0,x0+i*s,y0+s*P.rows,12,P.ink);
    for(let j=0;j<=P.rows;j++)line(x0,y0+j*s,x0+s*P.cols,y0+j*s,12,P.ink);}
  else ex.forEach(([w,h,n,col],i)=>{const cx=90+300*(i%3),cy=228+318*Math.floor(i/3),s=62,x0=cx+150-s*1.5,y0=cy+40;
